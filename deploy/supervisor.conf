[program:shell-rs-server]
command=/root/shell-rs-server/shell-rs-server serve -listen 127.0.0.1:18090 -db /root/shell-rs-server/data/sync.db -trust-proxy
directory=/root/shell-rs-server
user=root
umask=077
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/shell-rs-server/logs/server.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
