        # ShellRS sync server
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:18090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 32m;
            proxy_read_timeout 120s;
        }
